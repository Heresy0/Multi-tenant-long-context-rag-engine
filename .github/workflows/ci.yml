name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: >-
        postgresql+psycopg://enterprise_app:enterprise_test@127.0.0.1:5432/enterprise_knowledge_test
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      BM25_TEST_DATABASE_URL: >-
        postgresql+psycopg://enterprise_app:enterprise_test@127.0.0.1:5432/enterprise_knowledge_test
      RUN_BM25_INTEGRATION_TESTS: "1"
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_REDIS_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start PostgreSQL with pgvector and pg_search
        run: |
          docker build -f docker/postgres/Dockerfile -t enterprise-postgres-ci .
          docker run --detach --name enterprise-postgres-ci \
            --publish 127.0.0.1:5432:5432 \
            --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_DB=enterprise_knowledge_test \
            -e POSTGRES_USER=enterprise_app \
            -e POSTGRES_PASSWORD=enterprise_test \
            enterprise-postgres-ci postgres -c shared_preload_libraries=pg_search
          for attempt in $(seq 1 30); do
            if docker exec enterprise-postgres-ci pg_isready -U enterprise_app -d enterprise_knowledge_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs enterprise-postgres-ci
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Node for frontend tests
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check frontend JavaScript and authentication
        run: |
          node --check backend/app/static/app.js
          node --check backend/app/static/auth.js
          node --test tests/frontend/auth.test.mjs

      - name: Compile
        run: python -m compileall backend scripts

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --tag enterprise-knowledge-api:${{ github.sha }} .
