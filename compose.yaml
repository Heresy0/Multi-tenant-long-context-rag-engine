services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: enterprise-knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - enterprise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.10-alpine
    container_name: enterprise-knowledge-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: enterprise-knowledge-keycloak
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
    mem_limit: 1g
    restart: unless-stopped

  api:
    build:
      context: .
    container_name: enterprise-knowledge-api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise-knowledge/protocol/openid-connect/certs
      DOCUMENT_STORAGE_DIR: /app/data/documents
    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        exec python -m uvicorn backend.app.main:app
        --host 0.0.0.0
        --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - enterprise_document_data:/app/data/documents
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
    container_name: enterprise-knowledge-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCUMENT_STORAGE_DIR: /app/data/documents
    command:
      - python
      - scripts/run_indexing_worker.py
    expose:
      - "9101"
    volumes:
      - enterprise_document_data:/app/data/documents
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/check_indexing_worker_health.py"
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: enterprise-knowledge-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - enterprise_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    restart: unless-stopped

  alert-webhook:
    build:
      context: .
    container_name: enterprise-knowledge-alert-webhook
    env_file:
      - path: .env.alerting
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      - python
      - -m
      - uvicorn
      - backend.app.alert_webhook_gateway:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: enterprise-knowledge-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - enterprise_alertmanager_data:/alertmanager
    depends_on:
      alert-webhook:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9093/-/ready"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.3
    container_name: enterprise-knowledge-loki
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - enterprise_loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: enterprise-knowledge-alloy
    user: "0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - enterprise_alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: enterprise-knowledge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - enterprise_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  enterprise_postgres_data:
  keycloak_data:
  enterprise_document_data:
  enterprise_prometheus_data:
  enterprise_grafana_data:
  enterprise_alertmanager_data:
  enterprise_loki_data:
  enterprise_alloy_data:
