global:
  resolve_timeout: 5m

route:
  receiver: enterprise-webhook
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: enterprise-webhook
      matchers:
        - severity="critical"
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 30m

receivers:
  - name: enterprise-webhook
    webhook_configs:
      - url: http://alert-webhook:8090/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 10s

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
