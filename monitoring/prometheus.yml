global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: enterprise-knowledge-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: enterprise-knowledge-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9101

  - job_name: enterprise-knowledge-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: enterprise-knowledge-alert-webhook
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-webhook:8090
